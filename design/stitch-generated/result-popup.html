<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boxy Puzzle - Level Clear</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FFD60A",
              "on-accent": "#1A1A1A",
              surface: "#FFFFFF",
              "text-primary": "#1A1A1A",
              "text-secondary": "#6B7280",
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "1rem",
              "xl": "1.5rem",
              "2xl": "20px",
              "3xl": "24px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans", "sans-serif"],
              display: ["Plus Jakarta Sans", "sans-serif"],
              body: ["Plus Jakarta Sans", "sans-serif"],
              label: ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .boxy-outline {
            border: 2px solid #1A1A1A;
        }
        .confetti-bg {
            background-image: radial-gradient(#FFD60A 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-50 font-body text-text-primary overflow-hidden">
<!-- Blurred Game Background Content -->
<main class="fixed inset-0 z-0 filter blur-md scale-105">
<div class="h-full w-full bg-[#F8F9FA] flex flex-col p-6 items-center">
<!-- Mock Top Bar -->
<div class="w-full flex justify-between items-center mb-8">
<div class="w-10 h-10 rounded-full bg-gray-200"></div>
<div class="bg-white px-4 py-2 rounded-full shadow-sm font-bold">LEVEL 12</div>
<div class="w-10 h-10 rounded-lg bg-gray-200"></div>
</div>
<!-- Mock Puzzle Grid -->
<div class="grid grid-cols-4 gap-3 w-full max-w-sm aspect-square bg-white p-4 rounded-3xl shadow-inner">
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-400 rounded-xl border-2 border-black"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-400 rounded-xl border-2 border-black"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-400 rounded-xl border-2 border-black"></div>
<div class="bg-yellow-400 rounded-xl border-2 border-black"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-100 rounded-xl"></div>
<div class="bg-yellow-400 rounded-xl border-2 border-black"></div>
</div>
</div>
</main>
<!-- Overlay -->
<div class="fixed inset-0 bg-gray-900/60 z-40 flex items-center justify-center p-6">
<!-- Result Popup Card -->
<div class="bg-white w-[80%] max-w-[360px] rounded-3xl p-8 shadow-2xl relative overflow-hidden flex flex-col items-center animate-in fade-in zoom-in duration-300">
<!-- Confetti Background Layer -->
<div class="absolute inset-0 confetti-bg pointer-events-none"></div>
<!-- Boxy Cheering Mascot -->
<div class="relative w-32 h-32 mb-6 flex justify-center items-end">
<div class="w-24 h-24 bg-primary boxy-outline rounded-xl flex flex-col items-center justify-center relative shadow-[4px_4px_0px_#1A1A1A]">
<!-- Eyes -->
<div class="flex gap-4 mb-2">
<div class="w-2 h-2 bg-black rounded-full"></div>
<div class="w-2 h-2 bg-black rounded-full"></div>
</div>
<!-- Mouth -->
<div class="w-6 h-1 bg-black rounded-full"></div>
<!-- Arms (Cheering) -->
<div class="absolute -left-4 bottom-10 w-6 h-2 bg-primary boxy-outline -rotate-45 rounded-full"></div>
<div class="absolute -right-4 bottom-10 w-6 h-2 bg-primary boxy-outline rotate-45 rounded-full"></div>
</div>
<!-- Decorative Image Placeholder for Mascot Sparkles -->
<img alt="Cheering Boxy" class="absolute inset-0 w-full h-full object-contain pointer-events-none opacity-20" data-alt="cheerful yellow cube character with arms up surrounded by simple sparkles and confetti on white background vector style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClEAGUIaoNFlbfzVgSlJhTE76nBv7hck8IC7MVbyPXPOpx95OAFfDI0Iu5B_k_yt9ao2Fc-kPk-wlIYAWy2HxfgeG1C7AAJqxwTggXuu3tcedDQFQ3INH87FqOL1Pdx7u0WIjwGeYoEZ7lxhqsFpVrLk2chSCeSk52_jkb2nOUseXl5npLMoczz-sZgzG_3aR3Hsn6HBfAt2_tSt1QrSrkrFByN-PTlPXc8kLa8t-zh_ZhhZvbzy-htLD7glb_14VfzzQGyV_1BZj-"/>
</div>
<!-- Title -->
<h1 class="text-[24px] font-bold text-text-primary mb-4">레벨 클리어!</h1>
<!-- Stars -->
<div class="flex gap-2 mb-4">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Performance Text -->
<p class="text-[16px] font-medium text-text-secondary mb-8">60초만에 클리어!</p>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 w-full">
<button class="h-[48px] w-full bg-primary text-on-accent font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center">
                    다음 레벨
                </button>
<button class="h-[48px] w-full bg-white border-2 border-gray-200 text-text-primary font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center">
                    다시하기
                </button>
</div>
<!-- Secondary Link -->
<button class="mt-6 text-[14px] text-gray-400 font-medium hover:text-gray-600 transition-colors">
                메뉴로 돌아가기
            </button>
</div>
</div>
<!-- Hidden Navigation Filter Applied: 
         - Success/Confirmation splash screens suppress navigation shell to prioritize focus.
         - Transactional/Focused journeys hide BottomNavBar and TopAppBar.
    -->
</body></html>
