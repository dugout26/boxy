<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFD60A",
                        onAccent: "#1A1A1A",
                        bgLight: "#FFF8F0", // Custom warm beige requested
                        bgSurface: "#FFFFFF",
                        border: "#E5E7EB",
                        textPrimary: "#1A1A1A",
                        textSecondary: "#6B7280",
                        success: "#4ADE80",
                        warning: "#FBBF24",
                        error: "#EF4444",
                    },
                    borderRadius: {
                        "DEFAULT": "12px",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFF8F0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .boxy-border { border: 2px solid #1A1A1A; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #FFD60A;
            border: 2px solid #1A1A1A;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-textPrimary antialiased pb-24">
<!-- TopAppBar Section -->
<!-- JSON Rule: TopAppBar type small, leading arrow_back, title 설정 -->
<header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex items-center w-full px-4 h-14 sticky top-0 z-50">
<button class="active:scale-95 transition-transform duration-100 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-gray-900 dark:text-gray-100" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-bold text-gray-900 dark:text-gray-100 text-xl">설정</h1>
</header>
<!-- Content Canvas -->
<main class="px-4 py-6 max-w-md mx-auto space-y-6">
<!-- Mascot Greeting -->
<div class="flex items-center space-x-4 bg-white p-4 rounded-[12px] boxy-border">
<div class="w-16 h-16 bg-[#FFD60A] boxy-border rounded-lg flex flex-col items-center justify-center relative overflow-hidden">
<div class="flex space-x-3 mt-1">
<div class="w-1.5 h-1.5 bg-black rounded-full"></div>
<div class="w-1.5 h-1.5 bg-black rounded-full"></div>
</div>
<div class="w-6 h-[2px] bg-black mt-2"></div>
<!-- Boxy Body Texture/Shadow -->
<div class="absolute bottom-0 w-full h-2 bg-black/10"></div>
</div>
<div>
<p class="font-bold text-lg">박시와 함께 설정하기</p>
<p class="text-textSecondary text-sm">원하는 대로 앱을 맞춰보세요!</p>
</div>
</div>
<!-- Sound Section -->
<section class="space-y-3">
<h2 class="text-sm font-extrabold text-textSecondary uppercase tracking-wider px-1">SOUND</h2>
<div class="bg-white rounded-[12px] p-4 space-y-6 shadow-sm border border-border">
<!-- BGM -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-bold text-sm flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="music_note">music_note</span>
                            배경음악
                        </label>
<span class="text-xs font-bold">80%</span>
</div>
<input class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-[#FFD60A] slider-thumb" type="range" value="80"/>
</div>
<!-- SFX -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-bold text-sm flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="volume_up">volume_up</span>
                            효과음
                        </label>
<span class="text-xs font-bold">80%</span>
</div>
<input class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-[#FFD60A] slider-thumb" type="range" value="80"/>
</div>
<!-- Haptic -->
<div class="flex justify-between items-center">
<label class="font-bold text-sm flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="vibration">vibration</span>
                        햅틱 피드백
                    </label>
<button class="w-12 h-6 bg-primary boxy-border rounded-full relative flex items-center transition-colors">
<div class="absolute right-0.5 w-4.5 h-4.5 bg-onAccent rounded-full border border-black transform translate-x-[-2px]"></div>
</button>
</div>
</div>
</section>
<!-- General Section -->
<section class="space-y-3">
<h2 class="text-sm font-extrabold text-textSecondary uppercase tracking-wider px-1">GENERAL</h2>
<div class="bg-white rounded-[12px] shadow-sm border border-border divide-y divide-gray-100 overflow-hidden">
<div class="p-4 flex justify-between items-center active:bg-gray-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-400" data-icon="language">language</span>
<span class="font-bold">언어</span>
</div>
<div class="flex items-center gap-1 text-textSecondary">
<span class="text-sm">한국어</span>
<span class="material-symbols-outlined text-sm" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<div class="p-4 flex justify-between items-center active:bg-gray-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-400" data-icon="ad_off">ad_off</span>
<span class="font-bold">광고 제거</span>
</div>
<button class="bg-[#FFD60A] text-onAccent px-4 py-1.5 rounded-[12px] font-extrabold text-sm boxy-border active:scale-95 transition-transform">
                        ₩3,900
                    </button>
</div>
</div>
</section>
<!-- Support Section -->
<section class="space-y-3">
<h2 class="text-sm font-extrabold text-textSecondary uppercase tracking-wider px-1">SUPPORT</h2>
<div class="bg-white rounded-[12px] shadow-sm border border-border divide-y divide-gray-100 overflow-hidden">
<div class="p-4 flex justify-between items-center active:bg-gray-50">
<span class="font-bold">개인정보 처리방침</span>
<span class="material-symbols-outlined text-gray-400" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 flex justify-between items-center active:bg-gray-50">
<span class="font-bold">이용약관</span>
<span class="material-symbols-outlined text-gray-400" data-icon="chevron_right">chevron_right</span>
</div>
<div class="p-4 flex justify-between items-center active:bg-gray-50">
<span class="font-bold">문의하기</span>
<span class="material-symbols-outlined text-gray-400" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</section>
<!-- Danger Zone -->
<section class="space-y-3 pt-2">
<div class="bg-white rounded-[12px] shadow-sm border border-error/20 overflow-hidden">
<button class="w-full p-4 flex items-center justify-center gap-2 text-error active:bg-error/5 transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="delete">delete</span>
<span class="font-bold">진행도 초기화</span>
</button>
</div>
</section>
<!-- Footer -->
<footer class="text-center pt-4 pb-8 text-textSecondary space-y-1">
<p class="text-xs font-bold">v1.0.0</p>
<p class="text-[10px]">© 2024 Mound Brand. All rights reserved.</p>
</footer>
</main>
<!-- BottomNavBar Section -->
<!-- Active State Logic: Settings is logically under "내 정보" (Profile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800">
<!-- 홈 -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-90 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[12px] font-medium">홈</span>
</a>
<!-- 검색 -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-90 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="text-[12px] font-medium">검색</span>
</a>
<!-- 활동 -->
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-90 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="text-[12px] font-medium">활동</span>
</a>
<!-- 내 정보 (Active) -->
<a class="flex flex-col items-center justify-center bg-[#FFD60A] text-[#1A1A1A] rounded-xl px-4 py-1 active:scale-90 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="person" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[12px] font-medium">내 정보</span>
</a>
</nav>
<!-- Decorative Mascot at Bottom -->
<div class="fixed bottom-24 right-4 pointer-events-none opacity-20">
<div class="w-24 h-24 bg-[#FFD60A] boxy-border rounded-lg flex flex-col items-center justify-center rotate-12">
<div class="flex space-x-4">
<div class="w-2 h-2 bg-black rounded-full"></div>
<div class="w-2 h-2 bg-black rounded-full"></div>
</div>
<div class="w-10 h-[3px] bg-black mt-3"></div>
</div>
</div>
</body></html>
