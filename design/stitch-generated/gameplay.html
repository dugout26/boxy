<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'primary-accent': '#FFD60A',
                        'on-accent': '#1A1A1A',
                        'bg-light': '#FFF8F0',
                        'bg-surface': '#FFFFFF',
                        'border-color': '#E5E7EB',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#6B7280'
                    },
                    borderRadius: {
                        'DEFAULT': '0.75rem',
                        'lg': '1rem',
                        'xl': '1.5rem',
                        '2xl': '2rem',
                        'full': '9999px'
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'sans-serif'],
                        'display': ['Plus Jakarta Sans', 'sans-serif'],
                        'body': ['Plus Jakarta Sans', 'sans-serif'],
                        'label': ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FFF8F0; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
        .grid-pattern { background-image: radial-gradient(#E5E7EB 1px, transparent 1px); background-size: 20px 20px; }
        .backpack-shadow { box-shadow: inset 0 4px 8px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-text-primary overflow-hidden">
<!-- Top Navigation / HUD -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white dark:bg-gray-900 border-b-2 border-gray-200 dark:border-gray-800 shadow-sm rounded-b-[20px]">
<div class="flex items-center gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 hover:opacity-80 transition-opacity active:scale-95 duration-100">
<span class="material-symbols-outlined text-gray-900 dark:text-white" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<div class="flex flex-col items-center">
<h1 class="font-bold text-lg text-gray-900 dark:text-white leading-tight">Level 12</h1>
<div class="flex gap-1 mt-0.5">
<span class="material-symbols-outlined text-primary-accent text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-gray-300 text-sm" data-icon="star">star</span>
<span class="material-symbols-outlined text-gray-300 text-sm" data-icon="star">star</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 hover:opacity-80 transition-opacity active:scale-95 duration-100">
<span class="material-symbols-outlined text-gray-900 dark:text-white" data-icon="pause">pause</span>
</button>
</header>
<!-- Main Game Canvas -->
<main class="pt-20 pb-44 px-4 h-screen flex flex-col items-center justify-center">
<!-- Progress Bar HUD -->
<div class="w-full max-w-xs mb-8">
<div class="flex justify-between items-end mb-2">
<span class="text-xs font-bold text-text-secondary">PACKING PROGRESS</span>
<span class="text-xs font-black text-primary-accent">95%</span>
</div>
<div class="w-full h-3 bg-white rounded-full border-2 border-gray-100 overflow-hidden shadow-sm">
<div class="h-full bg-primary-accent rounded-full" style="width: 95%;"></div>
</div>
</div>
<!-- The Backpack Grid (Bento Style Puzzle Area) -->
<div class="relative w-full max-w-[340px] aspect-[6/8] bg-[#F2E8DF] rounded-[32px] border-[6px] border-[#D4C4B5] p-4 backpack-shadow">
<!-- Grid Background Overlay -->
<div class="grid grid-cols-6 grid-rows-8 gap-1 h-full w-full">
<!-- Row 1 (Top Empty) -->
<div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div>
<!-- Row 2-4 (Filled with Items - Visual representation using spanning divs) -->
<div class="col-span-2 row-span-3 bg-[#FF6B6B] border-2 border-[#E64141] rounded-xl flex items-center justify-center shadow-sm relative overflow-hidden">
<span class="material-symbols-outlined text-white opacity-40 text-4xl" data-icon="menu_book">menu_book</span>
<div class="absolute top-1 left-1 w-full h-full bg-white opacity-10 pointer-events-none"></div>
</div>
<div class="col-span-4 row-span-2 bg-[#4D96FF] border-2 border-[#3078E0] rounded-xl flex items-center justify-center shadow-sm relative overflow-hidden">
<span class="material-symbols-outlined text-white opacity-40 text-4xl" data-icon="event_note">event_note</span>
</div>
<!-- Filling the gaps for row 4 -->
<div class="col-span-2 row-span-2 bg-[#FFD93D] border-2 border-[#EBB800] rounded-xl flex items-center justify-center shadow-sm relative">
<span class="material-symbols-outlined text-white opacity-50 text-3xl" data-icon="lunch_dining">lunch_dining</span>
</div>
<div class="col-span-2 row-span-4 bg-[#6BCBCA] border-2 border-[#4DA8A7] rounded-xl flex items-center justify-center shadow-sm relative">
<span class="material-symbols-outlined text-white opacity-50 text-4xl" data-icon="water_full">water_full</span>
</div>
<!-- Remaining Empty Grid Cells -->
<div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div>
<div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div>
<div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div>
<div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div><div class="bg-[#E5D9CC] rounded-md"></div>
</div>
<!-- Boxy Mascot Peeking (Cozy Aesthetic) -->
<div class="absolute -top-12 -right-4 w-20 h-20 bg-primary-accent border-2 border-black rounded-xl flex flex-col items-center justify-center shadow-lg transform rotate-12">
<div class="flex gap-4 mt-2">
<div class="w-1.5 h-1.5 bg-black rounded-full"></div>
<div class="w-1.5 h-1.5 bg-black rounded-full"></div>
</div>
<div class="w-6 h-0.5 bg-black mt-2"></div>
</div>
</div>
<p class="mt-6 text-xs font-medium text-text-secondary opacity-60 tracking-wider">LONG PRESS TO ROTATE ITEMS</p>
</main>
<!-- Bottom Item Tray Section -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-white dark:bg-gray-900 border-t-2 border-gray-200 dark:border-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] rounded-t-[24px] pt-4 pb-12">
<div class="flex overflow-x-auto gap-4 px-6 no-scrollbar pb-2">
<!-- Item Card 1 -->
<div class="flex-shrink-0 w-20 h-20 bg-white border-2 border-gray-100 rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl text-red-400" data-icon="nutrition">nutrition</span>
</div>
<!-- Item Card 2 -->
<div class="flex-shrink-0 w-20 h-20 bg-white border-2 border-gray-100 rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl text-blue-400" data-icon="edit_square">edit_square</span>
</div>
<!-- Item Card 3 -->
<div class="flex-shrink-0 w-20 h-20 bg-white border-2 border-gray-100 rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl text-green-400" data-icon="library_books">library_books</span>
</div>
<!-- Item Card 4 -->
<div class="flex-shrink-0 w-20 h-20 bg-white border-2 border-gray-100 rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl text-orange-400" data-icon="straighten">straighten</span>
</div>
<!-- Item Card 5 -->
<div class="flex-shrink-0 w-20 h-20 bg-white border-2 border-gray-100 rounded-xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-4xl text-purple-400" data-icon="category">category</span>
</div>
</div>
</div>
<!-- Navigation Bar / Bottom FABs -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 py-4 pb-safe">
<!-- Hint FAB -->
<button class="flex flex-col items-center justify-center bg-primary-accent text-black rounded-[12px] px-6 py-2 shadow-lg active:scale-90 duration-100">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-xl" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="text-[10px] font-black bg-black text-white px-1 rounded">AD</span>
</div>
<span class="text-sm font-bold">Hint</span>
</button>
<!-- Undo FAB -->
<button class="flex flex-col items-center justify-center text-gray-600 bg-white border-2 border-gray-100 rounded-[12px] px-6 py-2 shadow-sm active:scale-90 duration-100">
<div class="relative">
<span class="material-symbols-outlined text-xl" data-icon="undo">undo</span>
<span class="absolute -top-2 -right-3 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full">3</span>
</div>
<span class="text-sm font-bold text-gray-900">Undo</span>
</button>
</nav>
<style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body></html>
