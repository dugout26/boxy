name: iOS Build & Upload (TestFlight Internal)

# 2-tier 전략 (decisions/2026-04-29-09):
#   develop push → "Boxy Dev" (com.mound.boxy.dev) → TestFlight Internal — 일상 검증
#   main push    → "Boxy Pack" (com.mound.boxy)     → TestFlight Internal — 출시 직전 최종 검증
# 외부 테스터(External/Beta) 안 함. 정수가 Internal로만 모두 검증.
on:
  # 시크릿 부분 등록 단계(Day 5~Week 3)에는 develop 푸시 빌드 비활성.
  # main 푸시 = 출시 직전 최종 빌드. 필요 시 workflow_dispatch로 수동 트리거.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.14f1
  BUILD_NUMBER_BASE: 100

jobs:
  ios-archive:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library/
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ env.ENV }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-${{ env.ENV }}-

      - name: Compute build number
        id: bn
        run: |
          BN=$((${{ env.BUILD_NUMBER_BASE }} + ${{ github.run_number }}))
          echo "build_number=$BN" >> $GITHUB_OUTPUT
          echo "▶ ENV=${{ env.ENV }} BUILD_NUMBER=$BN"

      - name: Decode secrets/ files (env-specific)
        env:
          GOOGLE_SERVICE_INFO_DEV_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_DEV }}
          GOOGLE_SERVICE_INFO_PROD_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD }}
          ENV_CONFIG_DEV_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_DEV }}
          ENV_CONFIG_PROD_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_PROD }}
          ENV_CONFIG_DEV_META_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_DEV_META }}
          ENV_CONFIG_PROD_META_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_PROD_META }}
        run: |
          mkdir -p secrets
          if [ "${{ env.ENV }}" = "prod" ]; then
            [ -n "$GOOGLE_SERVICE_INFO_PROD_B64" ] && echo "$GOOGLE_SERVICE_INFO_PROD_B64" | base64 --decode > secrets/GoogleService-Info-prod.plist && echo "▶ GoogleService-Info-prod.plist restored"
            [ -n "$ENV_CONFIG_PROD_B64" ] && echo "$ENV_CONFIG_PROD_B64" | base64 --decode > secrets/EnvironmentConfig-prod.asset && echo "▶ EnvironmentConfig-prod.asset restored"
            [ -n "$ENV_CONFIG_PROD_META_B64" ] && echo "$ENV_CONFIG_PROD_META_B64" | base64 --decode > secrets/EnvironmentConfig-prod.asset.meta
          else
            [ -n "$GOOGLE_SERVICE_INFO_DEV_B64" ] && echo "$GOOGLE_SERVICE_INFO_DEV_B64" | base64 --decode > secrets/GoogleService-Info-dev.plist && echo "▶ GoogleService-Info-dev.plist restored"
            [ -n "$ENV_CONFIG_DEV_B64" ] && echo "$ENV_CONFIG_DEV_B64" | base64 --decode > secrets/EnvironmentConfig-dev.asset && echo "▶ EnvironmentConfig-dev.asset restored"
            [ -n "$ENV_CONFIG_DEV_META_B64" ] && echo "$ENV_CONFIG_DEV_META_B64" | base64 --decode > secrets/EnvironmentConfig-dev.asset.meta
          fi

      - name: Unity build (iOS Xcode project — ${{ env.ENV }})
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_NUMBER_OVERRIDE: ${{ steps.bn.outputs.build_number }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: ${{ env.ENV == 'prod' && 'Boxy.Editor.BoxyBuilder.BumpAndBuildProductionIOS' || 'Boxy.Editor.BoxyBuilder.BumpAndBuildDevIOS' }}

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Run archive + upload script (TestFlight Internal)
        env:
          BOXY_ALLOW_UPLOAD: 1
          ENV: ${{ env.ENV }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          chmod +x ./scripts/ios-archive-upload.sh
          ./scripts/ios-archive-upload.sh

      - name: Cleanup ASC API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload artifacts (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: boxy-${{ env.ENV }}-ipa-${{ steps.bn.outputs.build_number }}
          path: Builds/ios-${{ env.ENV }}-ipa/*.ipa
          retention-days: 14
