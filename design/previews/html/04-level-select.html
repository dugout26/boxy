<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boxy Map - Levels</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFD60A",
                        onAccent: "#1A1A1A",
                        bgLight: "#F8F9FA",
                        bgSurface: "#FFFFFF",
                        borderDefault: "#E5E7EB",
                        textPrimary: "#1A1A1A",
                        textSecondary: "#6B7280",
                        success: "#4ADE80",
                        warning: "#FBBF24",
                        error: "#EF4444"
                    },
                    borderRadius: {
                        "DEFAULT": "12px",
                        "lg": "16px",
                        "xl": "20px",
                        "2xl": "24px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "sans-serif"],
                        display: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Plus Jakarta Sans", "sans-serif"],
                        label: ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .path-dotted {
            background-image: radial-gradient(#E5E7EB 2px, transparent 2px);
            background-size: 24px 24px;
        }
        .wavy-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bgLight text-textPrimary antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-[#F8F9FA] dark:bg-gray-900 border-b-2 border-[#E5E7EB] dark:border-gray-800">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors Active: scale-95 duration-100">
<span class="material-symbols-outlined text-textPrimary dark:text-white">arrow_back</span>
</button>
<h1 class="font-bold text-[20px] tracking-tight text-[#1A1A1A] dark:text-white">Levels</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-10 h-10 bg-primary border-2 border-onAccent rounded-lg flex flex-col items-center justify-center overflow-hidden">
<div class="flex gap-1 mt-1">
<div class="w-1 h-1 bg-onAccent rounded-full"></div>
<div class="w-1 h-1 bg-onAccent rounded-full"></div>
</div>
<div class="w-3 h-[2px] bg-onAccent mt-1"></div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors Active: scale-95 duration-100">
<span class="material-symbols-outlined text-textPrimary dark:text-white" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="pt-20 pb-32 px-4 max-w-md mx-auto min-h-screen relative">
<!-- Theme Tabs -->
<div class="flex justify-between items-center bg-white rounded-xl p-1 mb-8 shadow-sm border border-borderDefault">
<button class="flex-1 py-2 text-sm font-bold text-onAccent relative">
                School Bag
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-1 bg-primary rounded-full"></div>
</button>
<button class="flex-1 py-2 text-sm font-medium text-textSecondary hover:text-onAccent transition-colors">
                Moving Box
            </button>
<button class="flex-1 py-2 text-sm font-medium text-textSecondary hover:text-onAccent transition-colors">
                Travel Trunk
            </button>
</div>
<!-- Level Map Area -->
<div class="relative min-h-[800px] py-4">
<!-- Wavy Path SVG Background -->
<svg class="wavy-svg" fill="none" viewbox="0 0 360 800" xmlns="http://www.w3.org/2000/svg">
<path d="M180 50 C 280 150, 80 250, 180 350 S 280 550, 180 650 S 80 750, 180 850" stroke="#E5E7EB" stroke-dasharray="8 8" stroke-width="4"></path>
</svg>
<!-- Level Grid (5x6 logic expressed as free-form wavy layout) -->
<div class="relative z-10 grid grid-cols-3 gap-y-16 justify-items-center">
<!-- Level 1: Cleared -->
<div class="relative flex flex-col items-center">
<div class="flex gap-0.5 mb-1">
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[14px] text-primary -mt-1" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<button class="w-14 h-14 rounded-full bg-primary border-2 border-onAccent flex items-center justify-center font-extrabold text-onAccent shadow-md hover:scale-105 transition-transform">1</button>
</div>
<div></div> <!-- Spacer for wave -->
<!-- Level 2: Cleared -->
<div class="relative flex flex-col items-center">
<div class="flex gap-0.5 mb-1">
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[14px] text-primary -mt-1" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[12px] text-textSecondary opacity-30">star</span>
</div>
<button class="w-14 h-14 rounded-full bg-primary border-2 border-onAccent flex items-center justify-center font-extrabold text-onAccent shadow-md hover:scale-105 transition-transform">2</button>
</div>
<!-- Level 3: Cleared -->
<div class="relative flex flex-col items-center col-start-2">
<div class="flex gap-0.5 mb-1">
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[14px] text-primary -mt-1" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<button class="w-14 h-14 rounded-full bg-primary border-2 border-onAccent flex items-center justify-center font-extrabold text-onAccent shadow-md hover:scale-105 transition-transform">3</button>
</div>
<!-- Level 4: Current -->
<div class="relative flex flex-col items-center col-start-1 mt-4">
<div class="absolute -inset-2 bg-primary/30 rounded-full animate-pulse"></div>
<button class="relative w-14 h-14 rounded-full bg-primary border-4 border-onAccent flex items-center justify-center font-extrabold text-onAccent shadow-lg hover:scale-110 transition-transform">4</button>
</div>
<div></div> <!-- Spacer -->
<!-- Level 5: Unlocked -->
<div class="relative flex flex-col items-center col-start-2">
<button class="w-14 h-14 rounded-full bg-primary border-2 border-onAccent flex items-center justify-center font-extrabold text-onAccent shadow-md hover:scale-105 transition-transform">5</button>
</div>
<!-- Level 6: Locked -->
<div class="relative flex flex-col items-center col-start-3">
<button class="w-14 h-14 rounded-full bg-transparent border-2 border-textSecondary/40 flex items-center justify-center text-textSecondary/40">
<span class="material-symbols-outlined text-lg">lock</span>
</button>
</div>
<!-- Level 7: Locked -->
<div class="relative flex flex-col items-center col-start-2">
<button class="w-14 h-14 rounded-full bg-transparent border-2 border-textSecondary/40 flex items-center justify-center text-textSecondary/40">
<span class="material-symbols-outlined text-lg">lock</span>
</button>
</div>
<!-- Level 8: Locked -->
<div class="relative flex flex-col items-center col-start-1">
<button class="w-14 h-14 rounded-full bg-transparent border-2 border-textSecondary/40 flex items-center justify-center text-textSecondary/40">
<span class="material-symbols-outlined text-lg">lock</span>
</button>
</div>
<!-- Continue Pattern... -->
<div class="relative flex flex-col items-center col-start-2">
<button class="w-14 h-14 rounded-full bg-transparent border-2 border-textSecondary/40 flex items-center justify-center text-textSecondary/40">
<span class="material-symbols-outlined text-lg">lock</span>
</button>
</div>
<div class="relative flex flex-col items-center col-start-3">
<button class="w-14 h-14 rounded-full bg-transparent border-2 border-textSecondary/40 flex items-center justify-center text-textSecondary/40">
<span class="material-symbols-outlined text-lg">lock</span>
</button>
</div>
</div>
<!-- Bento Info Card -->
<div class="mt-20 grid grid-cols-2 gap-4">
<div class="bg-white p-4 rounded-2xl border border-borderDefault shadow-sm col-span-2 flex items-center gap-4">
<div class="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">military_tech</span>
</div>
<div>
<p class="text-xs text-textSecondary font-medium">Current Progress</p>
<p class="font-bold text-onAccent">Level 4: Stationery Sort</p>
</div>
<button class="ml-auto bg-primary text-onAccent px-4 py-2 rounded-xl font-bold text-sm shadow-sm active:scale-95 transition-all">Play</button>
</div>
<div class="bg-white p-4 rounded-2xl border border-borderDefault shadow-sm flex flex-col items-center text-center">
<span class="material-symbols-outlined text-warning mb-1" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="text-xl font-extrabold text-onAccent">12/45</span>
<span class="text-[10px] uppercase tracking-wider text-textSecondary font-bold">Stars Earned</span>
</div>
<div class="bg-white p-4 rounded-2xl border border-borderDefault shadow-sm flex flex-col items-center text-center">
<span class="material-symbols-outlined text-error mb-1" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="text-xl font-extrabold text-onAccent">5/5</span>
<span class="text-[10px] uppercase tracking-wider text-textSecondary font-bold">Hearts Left</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-20 bg-white dark:bg-gray-950 rounded-t-[24px] border-t-2 border-[#E5E7EB] dark:border-gray-800 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-4 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-100">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-medium text-[14px]">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#FFD60A] text-[#1A1A1A] rounded-[12px] px-4 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-100">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-medium text-[14px]">Levels</span>
</button>
<button class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-4 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-100">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
<span class="font-medium text-[14px]">Shop</span>
</button>
<button class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-4 py-1.5 hover:opacity-80 transition-opacity active:scale-90 duration-100">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-medium text-[14px]">Profile</span>
</button>
</nav>
</body></html>
