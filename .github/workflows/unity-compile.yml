name: Unity Compile + Tests (PR validation)

# develop / main 으로 가는 PR만 검증.
# push (develop/main)는 ios/android 빌드 잡이 자체 컴파일 거치므로 중복 회피.
# feature/* push 검증 X (매 commit 부담 회피).
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: unity-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile + EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library/
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run Unity (compile only)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.14f1
          targetPlatform: Android
          buildMethod: Boxy.Editor.BoxyBuilder.CompileCheck

      - name: EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.14f1
          testMode: editmode
          checkName: EditMode Tests
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Boxy.App,+Mound.Core,+Mound.Monetization,+Mound.UI,+Mound.Localization'
