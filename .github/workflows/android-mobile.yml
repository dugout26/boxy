name: Android Build & Upload (Play Internal Testing)

# 2-tier 전략 (decisions/2026-04-29-09):
#   develop push → "Boxy Dev"  (com.mound.boxy.dev) → Play Internal Testing — 일상 검증
#   main push    → "Boxy Pack" (com.mound.boxy)     → Play Internal Testing — 출시 직전 최종 검증
# Closed/Beta 트랙 안 함. 정수가 Internal로만 모두 검증.
on:
  push:
    branches: [develop, main]

concurrency:
  group: android-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.14f1
  BUILD_NUMBER_BASE: 100

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      PACKAGE_NAME: ${{ github.ref == 'refs/heads/main' && 'com.mound.boxy' || 'com.mound.boxy.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library/
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.ENV }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.ENV }}-

      - name: Compute build number
        id: bn
        run: |
          BN=$((${{ env.BUILD_NUMBER_BASE }} + ${{ github.run_number }}))
          echo "build_number=$BN" >> $GITHUB_OUTPUT
          echo "▶ ENV=${{ env.ENV }} BUILD_NUMBER=$BN package=${{ env.PACKAGE_NAME }}"

      - name: Decode secrets/ files (env-specific)
        env:
          GOOGLE_SERVICES_DEV_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          GOOGLE_SERVICES_PROD_B64: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          ENV_CONFIG_DEV_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_DEV }}
          ENV_CONFIG_PROD_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_PROD }}
          ENV_CONFIG_DEV_META_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_DEV_META }}
          ENV_CONFIG_PROD_META_B64: ${{ secrets.ENVIRONMENT_CONFIG_ASSET_PROD_META }}
        run: |
          mkdir -p secrets
          if [ "${{ env.ENV }}" = "prod" ]; then
            [ -n "$GOOGLE_SERVICES_PROD_B64" ] && echo "$GOOGLE_SERVICES_PROD_B64" | base64 --decode > secrets/google-services-prod.json && echo "▶ google-services-prod.json restored"
            [ -n "$ENV_CONFIG_PROD_B64" ] && echo "$ENV_CONFIG_PROD_B64" | base64 --decode > secrets/EnvironmentConfig-prod.asset && echo "▶ EnvironmentConfig-prod.asset restored"
            [ -n "$ENV_CONFIG_PROD_META_B64" ] && echo "$ENV_CONFIG_PROD_META_B64" | base64 --decode > secrets/EnvironmentConfig-prod.asset.meta
          else
            [ -n "$GOOGLE_SERVICES_DEV_B64" ] && echo "$GOOGLE_SERVICES_DEV_B64" | base64 --decode > secrets/google-services-dev.json && echo "▶ google-services-dev.json restored"
            [ -n "$ENV_CONFIG_DEV_B64" ] && echo "$ENV_CONFIG_DEV_B64" | base64 --decode > secrets/EnvironmentConfig-dev.asset && echo "▶ EnvironmentConfig-dev.asset restored"
            [ -n "$ENV_CONFIG_DEV_META_B64" ] && echo "$ENV_CONFIG_DEV_META_B64" | base64 --decode > secrets/EnvironmentConfig-dev.asset.meta
          fi

      - name: Unity build (Android — ${{ env.ENV }})
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_NUMBER_OVERRIDE: ${{ steps.bn.outputs.build_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: ${{ env.ENV == 'prod' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: boxy-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildMethod: ${{ env.ENV == 'prod' && 'Boxy.Editor.BoxyBuilder.BumpAndBuildProductionAndroid' || 'Boxy.Editor.BoxyBuilder.BumpAndBuildDevAndroid' }}

      - name: Locate build artifact
        id: artifact
        run: |
          if [ "${{ env.ENV }}" = "prod" ]; then
            FILE=$(find Builds -name "*.aab" -type f | head -1)
          else
            FILE=$(find Builds -name "*.apk" -type f | head -1)
          fi
          [ -z "$FILE" ] && echo "❌ artifact not found" && exit 1
          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "▶ artifact: $FILE"

      - name: Upload to Google Play Console (Internal Testing — ${{ env.ENV }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.artifact.outputs.path }}
          track: internal
          status: completed

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxy-${{ env.ENV }}-android-${{ steps.bn.outputs.build_number }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 14
