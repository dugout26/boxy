<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'primary': '#FFD60A',
                        'on-accent': '#1A1A1A',
                        'bg-light': '#F8F9FA',
                        'bg-surface': '#FFFFFF',
                        'border-gray': '#E5E7EB',
                        'text-primary': '#1A1A1A',
                        'text-secondary': '#6B7280',
                    },
                    borderRadius: {
                        'DEFAULT': '0.5rem',
                        'lg': '1rem',
                        'xl': '1.5rem',
                        'full': '9999px',
                    },
                    fontFamily: {
                        'headline': ['Plus Jakarta Sans', 'sans-serif'],
                        'display': ['Plus Jakarta Sans', 'sans-serif'],
                        'body': ['Plus Jakarta Sans', 'sans-serif'],
                        'label': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .boxy-border {
            border: 2px solid #1A1A1A;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F8F9FA] font-body text-text-primary antialiased">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-14 bg-[#F8F9FA] dark:bg-gray-900 border-b-2 border-[#E5E7EB] dark:border-gray-800 transition-all duration-250 active:scale-95">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#1A1A1A] dark:text-white">menu</span>
<h1 class="font-bold text-xl text-[#1A1A1A] dark:text-white">Mound</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-[#1A1A1A] dark:text-white">account_circle</span>
</div>
</header>
<!-- Main Content Background (Mocking a Puzzle Screen) -->
<main class="pt-20 pb-24 px-6 min-h-screen flex flex-col items-center">
<div class="w-full max-w-md grid grid-cols-2 gap-4">
<div class="aspect-square bg-white rounded-xl boxy-border flex items-center justify-center overflow-hidden">
<img class="w-24 h-24 object-contain" data-alt="cute minimalist 3d yellow box character with simple dot eyes and a flat line mouth sitting on a white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBw3QPofE6k7oRGKvVupaWjuSHOQ9566wHvOUNrYPnDlcTzzynQhpMcdlmNCLW3NE2zki65fMxOxlJcpaQO2O_rZRHLj1w4iHLTTd8Gm9kWr8PS-a6Qj0JMx2WVP83QAr1fa6pzVHaV3fhsjeOmsS95htT1o8Wk8xAD2rABm68PbkORTGlM0YhJe0uHjUdOitqOzT6YaA9B-7FTN4CY6VWFbYvbRBtIXbrfFTYRlX26mA6roOLMN0H40xJgMgEo0NGOthd1nGXvgSuA"/>
</div>
<div class="aspect-square bg-white rounded-xl boxy-border flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-border-gray">extension</span>
</div>
<div class="aspect-square bg-white rounded-xl boxy-border flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-border-gray">extension</span>
</div>
<div class="aspect-square bg-white rounded-xl boxy-border flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-border-gray">extension</span>
</div>
</div>
</main>
<!-- AdReward Popup Overlay -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-6">
<!-- Modal Card -->
<div class="bg-white w-[90%] max-w-[340px] rounded-[24px] p-8 flex flex-col items-center shadow-2xl boxy-border relative">
<!-- Mascot Decoration (Floating slightly above) -->
<div class="absolute -top-12 flex flex-col items-center">
<div class="w-20 h-20 bg-[#FFD60A] rounded-xl boxy-border flex flex-col items-center justify-center shadow-lg">
<div class="flex gap-3 mb-1">
<div class="w-1.5 h-1.5 bg-[#1A1A1A] rounded-full"></div>
<div class="w-1.5 h-1.5 bg-[#1A1A1A] rounded-full"></div>
</div>
<div class="w-6 h-0.5 bg-[#1A1A1A] rounded-full"></div>
</div>
</div>
<!-- Header Badge -->
<div class="mt-8 mb-4 flex items-center gap-1.5 bg-bg-light px-3 py-1 rounded-full border border-border-gray">
<span class="material-symbols-outlined text-sm text-text-secondary">play_circle</span>
<span class="text-xs font-bold text-text-secondary tracking-tight">광고 시청</span>
</div>
<!-- Title & Description -->
<h2 class="text-[24px] font-bold text-text-primary mb-2">힌트가 필요해요?</h2>
<p class="text-[14px] text-text-secondary text-center leading-snug mb-8">
                짧은 광고를 보고 힌트 1개를 받아<br/>퍼즐을 이어가세요
            </p>
<!-- Reward Visualization -->
<div class="w-full bg-bg-light rounded-xl p-4 flex flex-col items-center justify-center mb-8 border-2 border-dashed border-border-gray">
<span class="material-symbols-outlined text-[#FFD60A] text-5xl mb-2" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<div class="bg-primary text-on-accent px-4 py-1 rounded-full font-bold text-sm boxy-border">
                    +1 힌트
                </div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-3">
<button class="h-[48px] w-full bg-primary text-on-accent font-bold rounded-[12px] boxy-border transition-transform active:scale-95 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    광고 보기
                </button>
<button class="h-[48px] w-full bg-white text-on-accent font-bold rounded-[12px] border-2 border-[#1A1A1A] transition-transform active:scale-95">
                    닫기
                </button>
</div>
<!-- Disclaimer -->
<p class="mt-4 text-[12px] text-text-secondary">
                광고 시청 후 자동 보상 지급
            </p>
</div>
</div>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe h-20 bg-white dark:bg-gray-950 rounded-t-[24px] border-t-2 border-[#E5E7EB] dark:border-gray-800 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-3 py-1 transition-transform duration-250 active:scale-90">
<span class="material-symbols-outlined">home</span>
<span class="text-sm font-medium">홈</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#FFD60A] text-[#1A1A1A] rounded-[12px] px-3 py-1 transition-transform duration-250 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">extension</span>
<span class="text-sm font-medium font-bold">퍼즐</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-3 py-1 transition-transform duration-250 active:scale-90">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="text-sm font-medium">상점</span>
</div>
<div class="flex flex-col items-center justify-center text-[#6B7280] dark:text-gray-400 px-3 py-1 transition-transform duration-250 active:scale-90">
<span class="material-symbols-outlined">settings</span>
<span class="text-sm font-medium">설정</span>
</div>
</nav>
</body></html>
