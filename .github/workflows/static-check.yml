name: Static Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pattern-check:
    name: Pattern Violations (CLAUDE.md §19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./scripts/check-violations.sh

      - name: Run pattern check
        run: ./scripts/check-violations.sh all

