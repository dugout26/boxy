<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Boxy Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FFD60A",
              "on-accent": "#1A1A1A",
              "bg-light": "#F8F9FA",
              "bg-warm": "#FFF8F0",
              "text-primary": "#1A1A1A",
              "text-secondary": "#6B7280",
              border: "#E5E7EB"
            },
            borderRadius: {
              "DEFAULT": "12px",
              "lg": "12px",
              "xl": "20px",
              "2xl": "24px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans", "sans-serif"],
              display: ["Plus Jakarta Sans", "sans-serif"],
              body: ["Plus Jakarta Sans", "sans-serif"],
              label: ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .boxy-body {
        border: 2px solid #1A1A1A;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bg-warm font-body text-text-primary min-h-screen flex flex-col">
<!-- TopAppBar from JSON - Suppressed based on "Linear/Transactional" rule for Onboarding -->
<main class="flex-1 flex flex-col items-center justify-between px-8 py-12 max-w-md mx-auto w-full">
<!-- Mascot Section -->
<div class="w-full flex flex-col items-center mt-8">
<!-- Speech Bubble -->
<div class="relative bg-white boxy-body rounded-xl px-6 py-4 mb-6 shadow-sm">
<p class="text-text-primary font-bold text-center leading-relaxed">
                    안녕! 나는 Boxy야<br/>함께 짐 정리 해보자!
                </p>
<!-- Bubble Tail -->
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-white border-r-2 border-b-2 border-black rotate-45"></div>
</div>
<!-- Boxy Mascot Visual -->
<div class="relative w-40 h-44 bg-primary boxy-body rounded-[12px] flex flex-col items-center justify-center shadow-lg">
<!-- Eyes -->
<div class="flex gap-8 mb-4">
<div class="w-3 h-3 bg-black rounded-full"></div>
<div class="w-3 h-3 bg-black rounded-full"></div>
</div>
<!-- Mouth -->
<div class="w-10 h-[2px] bg-black"></div>
<!-- Waving Hand (Abstract/Simple) -->
<div class="absolute -right-4 top-1/2 -translate-y-1/2 w-6 h-8 bg-primary boxy-body rounded-full rotate-12"></div>
</div>
</div>
<!-- Middle Content -->
<div class="text-center space-y-4 w-full">
<h1 class="text-[32px] font-extrabold tracking-tight">
                튜토리얼
            </h1>
<p class="text-text-secondary text-base leading-relaxed break-keep">
                박시와 함께 쉽고 재미있게 짐을 싸는 방법을 배워보세요.
            </p>
</div>
<!-- Bottom Actions & Indicators -->
<div class="w-full space-y-8">
<!-- Page Indicator -->
<div class="flex justify-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary boxy-body"></div>
<div class="w-3 h-3 rounded-full bg-gray-200"></div>
<div class="w-3 h-3 rounded-full bg-gray-200"></div>
</div>
<!-- Buttons -->
<div class="flex flex-col gap-4">
<button class="w-full h-12 bg-primary text-on-accent font-bold rounded-lg boxy-body transition-transform active:scale-95 duration-100 flex items-center justify-center">
                    시작하기
                </button>
<button class="w-full text-text-secondary text-sm font-medium hover:text-text-primary transition-colors">
                    건너뛰기
                </button>
</div>
</div>
</main>
<!-- Decorative Corner Element -->
<div class="fixed top-0 right-0 p-8 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[120px]" data-icon="inventory_2">inventory_2</span>
</div>
<!-- BottomNavBar from JSON - Suppressed based on "The Destination Rule" for Transactional screen -->
</body></html>
