<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFD60A",
                        onAccent: "#1A1A1A",
                        bgLight: "#F8F9FA",
                        bgSurface: "#FFFFFF",
                        border: "#E5E7EB",
                        textPrimary: "#1A1A1A",
                        textSecondary: "#6B7280",
                        success: "#4ADE80",
                        warning: "#FBBF24",
                        error: "#EF4444",
                        warmBeige: "#FFF8F0"
                    },
                    borderRadius: {
                        "DEFAULT": "12px",
                        "lg": "16px",
                        "xl": "20px",
                        "2xl": "24px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "sans-serif"],
                        display: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Plus Jakarta Sans", "sans-serif"],
                        label: ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFF8F0;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for high density grid */
        .grid-container::-webkit-scrollbar {
            width: 4px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-textPrimary max-w-[430px] mx-auto min-h-screen flex flex-col relative overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white dark:bg-gray-900 border-b-2 border-gray-100 dark:border-gray-800 flex justify-between items-center w-full px-4 h-14 sticky top-0 z-50">
<button class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors active:scale-95 duration-100 flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined text-textPrimary dark:text-white" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-bold text-[20px] tracking-tight text-gray-900 dark:text-white">레벨 선택</h1>
<div class="text-[#FFD60A] font-bold flex items-center gap-1 bg-gray-50 dark:bg-gray-800 px-3 py-1 rounded-full border border-gray-100">
<span class="text-base">⭐</span>
<span class="text-[16px]">128</span>
</div>
</header>
<!-- Theme Tabs -->
<nav class="flex p-4 gap-2 bg-warmBeige">
<button class="flex-1 py-2 px-1 text-center rounded-lg bg-white shadow-sm border-b-4 border-primary font-bold text-sm text-textPrimary">
            학교가방
        </button>
<button class="flex-1 py-2 px-1 text-center rounded-lg text-textSecondary font-medium text-sm hover:bg-white/50 transition-colors">
            이사박스
        </button>
<button class="flex-1 py-2 px-1 text-center rounded-lg text-textSecondary font-medium text-sm hover:bg-white/50 transition-colors">
            여행트렁크
        </button>
</nav>
<!-- Mascot Decoration (Subtle) -->
<div class="absolute top-32 right-4 pointer-events-none opacity-20">
<div class="w-16 h-18 bg-primary border-2 border-onAccent rounded-md relative flex flex-col items-center justify-center">
<div class="flex gap-2 mt-2">
<div class="w-1.5 h-1.5 bg-onAccent rounded-full"></div>
<div class="w-1.5 h-1.5 bg-onAccent rounded-full"></div>
</div>
<div class="w-6 h-0.5 bg-onAccent mt-2"></div>
</div>
</div>
<!-- Main Content: High-Density Level Grid -->
<main class="flex-1 overflow-y-auto px-4 pb-32 grid-container">
<div class="grid grid-cols-5 gap-3 pt-2">
<!-- Loop representative items -->
<!-- Level 1: Completed 3 Stars -->
<div class="aspect-square bg-white rounded-lg flex flex-col items-center justify-center border-2 border-border relative active:scale-95 transition-transform">
<span class="text-xs font-bold text-textSecondary mb-1">1</span>
<div class="flex gap-0.5">
<span class="material-symbols-outlined text-[10px] text-primary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[10px] text-primary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[10px] text-primary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Level 2: Completed 2 Stars -->
<div class="aspect-square bg-white rounded-lg flex flex-col items-center justify-center border-2 border-border relative active:scale-95 transition-transform">
<span class="text-xs font-bold text-textSecondary mb-1">2</span>
<div class="flex gap-0.5">
<span class="material-symbols-outlined text-[10px] text-primary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[10px] text-primary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[10px] text-gray-200" data-icon="star">star</span>
</div>
</div>
<!-- Level 3-11: Varied stars (abbreviated for code length, normally 50) -->
<!-- Level 12: Current Highlighted Level -->
<div class="aspect-square bg-primary rounded-lg flex flex-col items-center justify-center border-2 border-onAccent relative active:scale-95 transition-transform shadow-[0_0_15px_rgba(255,214,10,0.5)] ring-2 ring-primary ring-offset-2">
<span class="text-xs font-black text-onAccent mb-1">12</span>
<div class="flex gap-0.5">
<span class="material-symbols-outlined text-[10px] text-onAccent" data-icon="star">star</span>
<span class="material-symbols-outlined text-[10px] text-onAccent" data-icon="star">star</span>
<span class="material-symbols-outlined text-[10px] text-onAccent" data-icon="star">star</span>
</div>
<div class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
</div>
<!-- Level 13-50: Locked/Empty -->
<!-- Generating 38 locked cells -->
<div class="aspect-square bg-gray-100/50 rounded-lg flex flex-col items-center justify-center border-2 border-gray-200 opacity-60">
<span class="material-symbols-outlined text-gray-400 text-sm" data-icon="lock">lock</span>
</div>
<!-- Repeat for visual density -->
<script>
                const mainGrid = document.querySelector('main .grid');
                for(let i=14; i<=50; i++) {
                    const cell = document.createElement('div');
                    cell.className = "aspect-square bg-gray-100/50 rounded-lg flex flex-col items-center justify-center border-2 border-gray-200 opacity-60";
                    cell.innerHTML = `<span class="material-symbols-outlined text-gray-400 text-sm" data-icon="lock">lock</span>`;
                    mainGrid.appendChild(cell);
                }
            </script>
</div>
</main>
<!-- Footer Progress Bar -->
<div class="fixed bottom-24 left-0 w-full px-6 py-4 bg-warmBeige/90 backdrop-blur-md">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-bold text-textPrimary">진행도: 학교가방</span>
<span class="text-sm font-black text-textPrimary">12 / 50 <span class="text-textSecondary font-medium ml-1">(60%)</span></span>
</div>
<div class="w-full h-4 bg-gray-200 rounded-full overflow-hidden border-2 border-white shadow-inner">
<div class="h-full bg-primary rounded-full transition-all duration-500 border-r-2 border-onAccent/10" style="width: 60%"></div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-white dark:bg-gray-900 border-t-2 border-gray-100 dark:border-gray-800 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] rounded-t-[24px] z-50">
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[14px] font-medium">홈</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#FFD60A] text-[#1A1A1A] rounded-[12px] px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="text-[14px] font-medium">레벨</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
<span class="text-[14px] font-medium">상점</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:opacity-80 transition-opacity active:scale-90 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[14px] font-medium">설정</span>
</a>
</nav>
<!-- Background texture/pattern for "Cozy" vibe -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[-1]" style="background-image: radial-gradient(#1A1A1A 1px, transparent 1px); background-size: 20px 20px;"></div>
</body></html>
