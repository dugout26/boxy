<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFD60A",
                        "on-accent": "#1A1A1A",
                        "bg-light": "#F8F9FA",
                        "bg-surface": "#FFFFFF",
                        border: "#E5E7EB",
                        "text-primary": "#1A1A1A",
                        "text-secondary": "#6B7280",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px",
                        "button": "12px",
                        "popup": "20px",
                        "toast": "24px"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "sans-serif"],
                        display: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Plus Jakarta Sans", "sans-serif"],
                        label: ["Plus Jakarta Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .boxy-stroke {
            stroke: #1A1A1A;
            stroke-width: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-bg-light font-body text-text-primary antialiased">
<!-- TopAppBar -->
<header class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center px-4 w-full h-16 fixed top-0 z-40 transition-all duration-200 active:scale-95">
<button class="hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-full">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400" data-icon="menu">menu</span>
</button>
<h1 class="font-sans text-gray-900 dark:text-gray-100 font-bold text-xl font-black text-gray-900 dark:text-white">Mound</h1>
<div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden border border-gray-100">
<img alt="User profile" class="w-full h-full object-cover" data-alt="Close-up studio portrait of a smiling person with clean lighting and neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuUibyFxRvhQ5BN9viD-4PRdi1aEXekuESCBD3PRQJ6zUnnhEby1wqqOtb6Xe637Rs7drQonVIVO5rFC_X0628y1Zc6yPflYRJPGAYkJkbI-VZGD3t2vFnykjOKtiGfHNhUHOoYGIurJZBOvvTn4FSmZhr8sjgiPSD-HJko9b7f1-Sg0HJ16voFPAL0hXDxBZrr1CiA7Em64Cxa67ATvTOUnGlRZ18nL_6cinwkB7W-QB5C9EumPvrh14SQ-dgcJ5dVux_S3ub51es"/>
</div>
</header>
<!-- Main Content Canvas (Background behind modal) -->
<main class="pt-20 pb-24 px-6 min-h-screen">
<div class="max-w-md mx-auto space-y-6">
<div class="bg-white p-6 rounded-xl border border-border shadow-sm">
<div class="flex justify-between items-center mb-4">
<span class="text-xs font-bold text-primary bg-on-accent px-3 py-1 rounded-full uppercase tracking-wider">Level 14</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="font-bold">0</span>
</div>
</div>
<div class="aspect-square bg-gray-50 rounded-lg border-2 border-dashed border-gray-200 flex items-center justify-center mb-6">
<div class="text-center">
<div class="grid grid-cols-4 gap-2 mb-4">
<div class="w-12 h-12 bg-white border-2 border-on-accent rounded flex items-center justify-center font-bold text-xl">M</div>
<div class="w-12 h-12 bg-white border-2 border-on-accent rounded flex items-center justify-center font-bold text-xl">O</div>
<div class="w-12 h-12 bg-white border-2 border-on-accent rounded flex items-center justify-center font-bold text-xl">U</div>
<div class="w-12 h-12 bg-white border-2 border-on-accent rounded flex items-center justify-center font-bold text-xl">N</div>
</div>
<p class="text-text-secondary text-sm">Tap tiles to solve</p>
</div>
</div>
</div>
</div>
</main>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-6 backdrop-blur-sm">
<!-- Centered Card -->
<div class="bg-white rounded-popup w-full max-w-[320px] p-6 shadow-2xl relative flex flex-col items-center text-center">
<!-- Close Button -->
<button class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-text-secondary hover:bg-gray-100 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Mascot: Boxy Cheering -->
<div class="w-16 h-16 mb-4 mt-2">
<svg class="w-full h-full" viewbox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
<!-- Boxy Body -->
<rect fill="#FFD60A" height="88" rx="8" stroke="#1A1A1A" stroke-width="4" width="80" x="10" y="10"></rect>
<!-- Cheering Eyes (Arcs ^_^) -->
<path d="M30 45 Q37.5 35 45 45" fill="none" stroke="#1A1A1A" stroke-linecap="round" stroke-width="4"></path>
<path d="M55 45 Q62.5 35 70 45" fill="none" stroke="#1A1A1A" stroke-linecap="round" stroke-width="4"></path>
<!-- Big Smile -->
<path d="M35 70 Q50 85 65 70" fill="none" stroke="#1A1A1A" stroke-linecap="round" stroke-width="4"></path>
</svg>
</div>
<!-- Title -->
<h2 class="text-[24px] leading-tight font-bold text-text-primary mb-2">Need a hint?</h2>
<!-- Body Text -->
<p class="text-[16px] leading-relaxed text-text-secondary mb-8">
                Watch a short ad to get 1 free hint and continue your puzzle
            </p>
<!-- Primary CTA -->
<button class="w-full h-[48px] bg-primary text-on-accent font-bold rounded-button flex items-center justify-center gap-2 transition-all duration-200 active:scale-95 shadow-sm">
<span class="material-symbols-outlined" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                Watch Ad → +1 Hint
            </button>
<!-- Secondary Action -->
<button class="mt-4 text-text-secondary font-medium px-4 py-2 hover:text-text-primary transition-colors">
                No thanks
            </button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 shadow-lg dark:shadow-none">
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-yellow-400 text-gray-900 rounded-xl px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="text-xs font-medium">Hints</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="redeem">redeem</span>
<span class="text-xs font-medium">Shop</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 transition-transform duration-200 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-xs font-medium">Settings</span>
</a>
</nav>
</body></html>
